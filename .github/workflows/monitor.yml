name: Fragility log and alerts

on:
  push:
    branches: [main]
    paths:
      - 'jobs/vanna-flow.mjs'
      - 'shared/vanna-flow/**'
      - 'test/vanna-flow.mjs'
      - '.github/workflows/monitor.yml'
  schedule:
    # Every 30 minutes, off the round minutes that GitHub delays most. Private repos
    # get 2,000 free job minutes a month (shared with gamma-detrite's refresh):
    # 30-minute runs here (~1,440) + gamma every 2 hours (~360) stay inside it.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_alerts:
        description: 'Send [test] phone alerts: all (Market Maker strategy, Alt, Trend), or one: mm, alt, trend; check = is the ntfy topic OK and what does ntfy hold'
        type: choice
        options: ['no', 'all', 'mm', 'alt', 'trend', 'check']
        default: 'no'

permissions:
  contents: write

concurrency:
  group: fragility-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data
          path: store

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the ntfy topic
        if: inputs.test_alerts == 'check'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node jobs/ntfy-check.mjs

      - name: Verify ETH flow alert rules
        id: vanna_rules
        run: node test/vanna-flow.mjs

      - name: Score, alert, log
        if: github.event_name != 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERTS: ${{ inputs.test_alerts }}
        run: node jobs/monitor.mjs store

      - name: ETH 24-hour Vanna and Charm changes
        if: ${{ !cancelled() && steps.vanna_rules.outcome == 'success' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node jobs/vanna-flow.mjs store

      - name: Save log
        if: ${{ !cancelled() }}
        working-directory: store
        run: |
          git config user.name "fragility-bot"
          git config user.email "fragility-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:data
