<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b0c">
  <script>
    // Saved colour style (teal / fire / moon); shared with Gamma Detrite (same site address).
    try { var lk = localStorage.getItem('look'); if (lk === 'fire' || lk === 'moon') document.documentElement.setAttribute('data-look', lk); } catch (e) {}
  </script>
  <title>Fragility Score</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Geist:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=52">
  <script>
    // Every module gets the same ?v= as the page, so a phone can never mix a new
    // file with an old cached one (that broke four tabs once, Nov 2026). The
    // version is read from the style.css link above. Keep this list in step with
    // tools/ and shared/; `node test/importmap.mjs` checks it.
    (function () {
      var link = document.querySelector('link[href*="assets/style.css"]');
      var v = (link && /[?&]v=([^&]+)/.exec(link.getAttribute('href')) || [])[1];
      if (!v || !HTMLScriptElement.supports || !HTMLScriptElement.supports('importmap')) return;
      var files = [
        'shared/gamma.js',
        'shared/head.js',
        'shared/http.js',
        'shared/levels.js',
        'shared/sources/binance.js',
        'shared/sources/bybit.js',
        'shared/sources/deribit.js',
        'shared/sources/gate.js',
        'shared/sources/okx.js',
        'shared/storage.js',
        'tools/alt-tactics/collect.js',
        'tools/alt-tactics/config.js',
        'tools/alt-tactics/model.js',
        'tools/embed.js',
        'tools/forced-flow/collect.js',
        'tools/forced-flow/config.js',
        'tools/forced-flow/model.js',
        'tools/forced-flow/read.js',
        'tools/fragility/alerts.js',
        'tools/fragility/collect.js',
        'tools/fragility/config.js',
        'tools/fragility/history.js',
        'tools/fragility/score.js',
        'tools/market-maker/collect.js',
        'tools/market-maker/config.js',
        'tools/market-maker/flip.js',
        'tools/market-maker/model.js',
        'tools/market-maker/read.js',
        'tools/playbook/collect.js',
        'tools/playbook/config.js',
        'tools/playbook/plan.js',
        'tools/tactics/collect.js',
        'tools/tactics/config.js',
        'tools/tactics/model.js',
        'tools/tactics/read.js',
        'tools/tactics/sources.js',
        'tools/trend/collect.js',
        'tools/trend/config.js',
        'tools/trend/model.js',
      ];
      var map = {};
      files.forEach(function (p) { map[new URL(p, document.baseURI).href] = new URL(p + '?v=' + v, document.baseURI).href; });
      var s = document.createElement('script');
      s.type = 'importmap';
      s.textContent = JSON.stringify({ imports: map });
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <header class="top">
    <nav class="tabs" id="tabs" aria-label="Tools"></nav>
    <button class="look-btn" id="look-btn" type="button" aria-label="Colour style" aria-haspopup="true" aria-expanded="false"></button>
    <div class="look-menu" id="look-menu" role="menu" hidden></div>
  </header>
  <main id="view"></main>
  <script type="module" src="assets/app.js?v=52"></script>
</body>
</html>
